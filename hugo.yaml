baseURL: https://hrkz777.github.io/
locale: ja-JP
defaultContentLanguage: ja
title: メモ置き場
timeZone: Asia/Tokyo
theme: hextra

enableRobotsTXT: true
hasCJKLanguage: true
cleanDestinationDir: true

outputs:
  home: [html]
  page: [html, markdown]
  section: [html, rss]

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false
  highlight:
    noClasses: false
  goldmark:
    renderer:
      unsafe: true

menu:
  main:
    - name: Windows設定
      pageRef: /windows
      weight: 1
    - name: OBS設定
      pageRef: /obs
      weight: 2
    - name: ポケモンタイプ相性
      url: https://hrkz777.github.io/pokemon-type-matchup/
      weight: 3
      params:
        type: link
    - name: 検索
      weight: 4
      params:
        type: search

params:
  description: GitHub Pages 上で公開している記事とメモ
  imageZoom:
    enable: true
    base: https://cdn.jsdelivr.net/npm/medium-zoom@1.1.0/dist
  navbar:
    displayTitle: true
    displayLogo: false
  theme:
    default: system
    displayToggle: true
  footer:
    enable: true
    displayCopyright: true
    displayPoweredBy: true
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward
