{{- $filename := .Get 0 -}}
{{- $filepath := path.Join "content" .Page.File.Dir $filename -}}
{{- $diagram := readFile $filepath -}}
<div role="img" aria-label="{{ (T "mermaidDiagram") | default "Diagram" }}">
  <pre class="mermaid hx:mt-6">{{ $diagram | htmlEscape | safeHTML }}</pre>
</div>
{{- .Page.Store.Set "hasMermaid" true -}}
