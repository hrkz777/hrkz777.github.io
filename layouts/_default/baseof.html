<!doctype html>
<html lang="{{ site.Language.LanguageCode }}">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ if .IsHome }}{{ site.Title }}{{ else }}{{ .Title }} | {{ site.Title }}{{ end }}</title>
    <meta name="description" content="{{ .Description | default site.Params.description }}">
    <link rel="stylesheet" href="{{ "assets/site.css" | relURL }}">
  </head>
  <body>
    <header class="site-header">
      <div class="shell header-shell">
        <a class="brand" href="{{ site.Home.RelPermalink }}">{{ site.Title }}</a>
        {{ if not .IsHome }}<a class="back-link" href="{{ site.Home.RelPermalink }}">記事一覧へ</a>{{ end }}
      </div>
    </header>
    <main class="shell main-shell">{{ block "main" . }}{{ end }}</main>
    <footer class="shell footer"><p>{{ site.Params.description }}</p></footer>
  </body>
</html>
